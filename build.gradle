plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'com.diffplug.spotless' version "6.13.0"
    id "com.hypherionmc.modutils.modpublisher" version "2.2.4"
}

group = mod_group_id

base {
    archivesName = "${mod_id}-forge-${mc_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(8)
    withSourcesJar()
}

println "Java: ${System.getProperty('java.version')}, JVM: ${System.getProperty('java.vm.version')} (${System.getProperty('java.vendor')}), Arch: ${System.getProperty('os.arch')}"

minecraft {
    mappings channel: mappings_channel, version: mappings_version

    runs {
        configureEach {
            workingDirectory project.file("run/${it.name}")

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {}
        server {}
    }
}

// FG6 on 1.12.2 loads the dev mod from the classes folder, so the processed resources (mcmod.info, lang) have to
// sit next to the classes for FML to find them during runClient/runServer.
def copyResourcesToClasses = tasks.register('copyResourcesToClasses', Copy) {
    dependsOn tasks.named('compileJava')
    from tasks.named('processResources')
    into sourceSets.main.java.destinationDirectory
}
tasks.named('classes') { dependsOn copyResourcesToClasses }

tasks.matching { it.name == 'runClient' || it.name == 'runServer' }.configureEach {
    dependsOn tasks.named('classes')

    doFirst {
        def builtJar = tasks.named('jar').get().archiveFile.get().asFile

        classpath = classpath.filter { file ->
            file.canonicalFile != builtJar.canonicalFile &&
                    !file.canonicalPath.startsWith(
                            layout.buildDirectory.dir('libs').get().asFile.canonicalPath +
                                    File.separator
                    )
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${mc_version}-${forge_version}"
}

processResources {
    Map replaceProperties = [
            mc_version        : mc_version,
            forge_version     : forge_version,
            mod_id            : mod_id,
            mod_name          : mod_name,
            mod_license       : mod_license,
            mod_version       : project.version,
            mod_author        : mod_author,
            mod_credits       : mod_credits,
            mod_description   : mod_description,
            mod_url           : mod_url,
            pack_format_number: pack_format_number,
    ]
    inputs.properties replaceProperties

    filesMatching(['mcmod.info', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

jar {
    // copyResourcesToClasses (needed for the dev runs) puts the processed resources into the classes folder too,
    // so the jar sees every resource twice. Both copies are identical; keep one.
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    from(rootProject.file('LICENSE')) {
        rename { "${it}_${mod_name}" }
    }

    manifest {
        attributes([
                'Specification-Title'     : mod_name,
                'Specification-Vendor'    : mod_author,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.version,
                'Implementation-Vendor'   : mod_author,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                'Built-On-Minecraft'      : mc_version
        ])
    }

    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

publishing {
    repositories {
        maven {
            name = project.mod_id
            url = project.maven_url
            credentials(PasswordCredentials)
            authentication {
                basic(BasicAuthentication)
            }
        }
    }
    publications {
        register('mavenJava', MavenPublication) {
            artifactId = base.archivesName.get()
            // The reobfuscated jar (reobfJar rewrites the jar task's output in place) plus sources. Not
            // `from components.java`, which would leak FG's deobfuscated minecraft dependency into the POM.
            artifact jar
            artifact sourcesJar
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

spotless {
    java {
        eclipse().configFile("$rootDir/eclipse-formatter.xml")
        endWithNewline()
        importOrder("", "java", group.toString(), "\\#")
        indentWithSpaces(4)
        removeUnusedImports()
        trimTrailingWhitespace()
    }
}

tasks.named('compileJava', JavaCompile) {
    dependsOn("spotlessApply")
}

def keysFile = rootProject.file('key.properties')
def keys = new Properties()

if (keysFile.exists()) {
    keysFile.withInputStream { keys.load(it) }
}

def curseKey = keys.getProperty('curseKey')

def publishingToCurseForge = gradle.startParameter.taskNames.any {
    it.toLowerCase().contains('publishcurseforge')
}

if (publishingToCurseForge && (!curseKey || curseKey.trim().isEmpty())) {
    throw new GradleException(
            "CurseForge publishing requires key.properties with a valid curseKey."
    )
}

publisher {
    apiKeys {
        curseforge curseKey ?: ""
    }

    setGameType("minecraft")

    setCurseID("1665914")
    setVersionType("release")
    setChangelog("changelog.md")
    setProjectVersion("${project.version}")
    setGameVersions("1.12.2")
    setLoaders("forge")
    setCurseEnvironment("both")

    setArtifact(jar)
    setJavaVersions([JavaVersion.VERSION_1_8])
}