# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
# This is required to provide enough memory for the Minecraft decompilation process.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

# Project
maven_url=https://maven.azuredoom.com/mods

# Mod options
mod_name=AzureCortex
mod_id=azurecortex
mod_group_id=com.azure.azurecortex
mod_author=AzureDoom
mod_credits=AzureDoom
mod_license=MIT
mod_url=https://modrinth.com/project/azurecortex
mod_description=A modular Minecraft entity AI framework combining behavior trees, GOAP planning, blackboards, interruptible actions, and custom navigation.
version=1.0.0

# MC/Forge Versions
mc_version=1.12.2
forge_version=14.23.5.2859

pack_format_number=3

# Mappings
mappings_channel=snapshot
mappings_version=20171003-1.12
